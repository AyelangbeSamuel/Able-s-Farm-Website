<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Hover Image</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 300px;
      height: 400px;
      perspective: 1000px;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      background: white;
    }

    .card:hover .image-wrapper {
      transform: rotateY(20deg) rotateX(10deg) scale(1.05);
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      backface-visibility: hidden;
      display: block;
    }

    .title {
      text-align: center;
      margin-top: 15px;
      font-size: 1.5rem;
      color: #333;
    }
    .card:hover .image-wrapper::before,.image-wrapper::after{
    opacity: 1;
    }
    .card:hover.image-wrapper::after{
      height: 120px;
    }
    .title{
      width: 100%;
      transition: transform 0.5s;
    }
    .card:hover{
      transform: translate3d(0%, -50px, 100px);
    }
    .container img{
  width: 10%;
  height: 100%;
  object-fit: cover;
  border-radius: 10%;
  border: 2px solid rgb(255, 255,255,0.684);
  transition: all 0.5s ease-in-out;
}
.container img:hover{
width: 25%;  
}
</style>
</head>
<body>

  <div class="card">
    <div class="image-wrapper">
      <img src="images/Broiler.jpeg" alt="Farm" />
    </div>
    <h2 class="title">ABLE'S FARM</h2>
  </div>
<div class="container">
  <img src="images/Layer.jpg">
  <img src="images/Duck.jpg">
  <img src="images/Turkey.jpg">
  <img src="images/Ostrich.jpg">
</div>
</body>
</html>
