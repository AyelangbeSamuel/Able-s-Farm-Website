<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory - Able's Farm</title>
  <link rel="stylesheet" href="css/Rstyle.css" />
  <link rel="icon" type="image/jpeg" href="images/Farm-logo.jpeg" />
</head>
<body class="neon">
  <header>
  <div class="logo">ABLE'S FARM</div>
  <nav>
    <a href="Rdash.html">Dashboard</a>
    <a href="R-order.html">Order</a>
    <a href="R-inventory.html">Inventory</a>
    <a href="R-analytic.html">Analytics</a>
     <a href="R-customer.html">Customer</a>
    <a href="R-overview.html">Overview</a>
    <a href="R-sales.html">Sales</a>
    <a href="R-settings.html">Settings</a>
  </nav>
</header>
  <div class="inventory-container">
    <h2>Inventory 🐣</h2>
    <form id="inventory-form" enctype="multipart/form-data">
      <label>Product Name</label>
      <input type="text" placeholder="e.g. Broiler Chicken" required>

      <label>Price (₦)</label>
      <input type="number" required>

      <label>Quantity</label>
      <input type="number" required>

      <label>Upload Image</label>
      <input type="file" accept="image/*" required>

      <label>Description</label>
      <textarea rows="3" placeholder="Describe the bird..."></textarea>

      <button type="submit">Add to Inventory</button>
    </form>

    <div class="inventory-list">
      <h3>Current Inventory</h3>
      <ul>
        <li>🐔 Layer Chicken - 20 units - ₦2,000</li>
        <li>🦃 Turkey - 10 units - ₦5,000</li>
      </ul>
    </div>
  </div>
</body>
</html>
