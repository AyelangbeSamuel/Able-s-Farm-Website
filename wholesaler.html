<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ABLE'S FARM Wholesaler- Login & Signup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="images/Farm-logo.jpeg" />
  <style>
    /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body and Background */
body {
  height: 100vh;
  background: linear-gradient(135deg, #0f0f1f, #1a1a2e);
  background-image: url('space-bg.jpg'); /* Replace with your image path */
  background-size: cover;
  background-position: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Container with Perspective */
.container {
  perspective: 1200px;
}

/* Flip Card */
.card {
  width: 380px;
  height: 460px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s ease-in-out;
}

.card.flipped {
  transform: rotateY(180deg);
}

/* Shared Side Styles */
.side {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 30px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(5px);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.front {
  transform: rotateY(0deg);
}

.back {
  transform: rotateY(180deg);
}

/* Titles */
h2 {
  color: #0a0c0c;
  font-size: 28px;
  margin-bottom: 25px;
  text-shadow: 0 0 5px #00fff7;
}

/* Inputs */
input {
  width: 85%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
}

input::placeholder {
  color: #ccc;
}

input:focus {
  background: rgba(255, 255, 255, 0.2);
}

/* Buttons */
button {
  width: 90%;
  padding: 12px;
  margin-top: 10px;
  background: #00fff7;
  color: #111;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s ease;
}

button:hover {
  background: #00cfc7;
}

/* Text */
p {
  margin-top: 15px;
  color: #ddd;
}

a {
  color: #00fff7;
  text-decoration: none;
  font-weight: bold;
}

a:hover {
  text-decoration: underline;
}
.video-bg {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .back-buttons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .back-buttons button {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #00ffe5;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease-in-out;
    }

    .back-buttons button:hover {
      background: #00ffe5;
      color: black;
    }

  </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop id="videoBackground">
    <source src="video/ABLE'S FARM BACKGROUND.mp4" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>
    <div class="container">
        <div class="card">
            <div class="side front">
                <h2>Login</h2>
                <form>
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button id="login-btn">Login</button>
                    <p>Don't have an account? <a href="#" id="flip-to-signup">Sign up</a></p>
                </form>
            </div>
            <div class="side back">
                <h2>Sign Up</h2>
                <form>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                    <button id="signup-btn">Sign Up</button>
                    <p>Already have an account? <a href="#" id="flip-to-login">Login</a></p>
                </form>
            </div>
        </div>
    </div>

<div class="back-buttons">
    <button onclick="location.href='index.html'">Return to Home</button>
    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Back to Top</button>
  </div>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const card = document.querySelector(".card");
    const loginBtn = document.querySelector("#login-btn");
    const signupBtn = document.querySelector("#signup-btn");
    const flipToSignup = document.querySelector("#flip-to-signup");
    const flipToLogin = document.querySelector("#flip-to-login");

    flipToSignup.addEventListener("click", (event) => {
        event.preventDefault();
        card.classList.add("flipped");
    });

    flipToLogin.addEventListener("click", (event) => {
        event.preventDefault();
        card.classList.remove("flipped");
    });

    loginBtn.addEventListener("click", (event) => {
        event.preventDefault();
        const loginEmail = document.querySelector("#login-email").value;
        const loginPassword = document.querySelector("#login-password").value;
        
        if (loginEmail.trim() === "" || loginPassword.trim() === "") {
            alert("Please fill in all login fields.");
        } else {
            console.log("Logging in with", loginEmail);
            alert("Login Successful!");
            window.location.href = "Wdash.html"; // Redirect to dashboard
        }
    });

    signupBtn.addEventListener("click", (event) => {
        event.preventDefault();
        const signupEmail = document.querySelector("#signup-email").value;
        const signupPassword = document.querySelector("#signup-password").value;
        const confirmPassword = document.querySelector("#confirm-password").value;
        
        if (signupEmail.trim() === "" || signupPassword.trim() === "" || confirmPassword.trim() === "") {
            alert("Please fill in all signup fields.");
        } else if (signupPassword !== confirmPassword) {
            alert("Passwords do not match.");
        } else {
            console.log("Signing up with", signupEmail);
            alert("Signup Successful! Redirecting to login page.");
            card.classList.remove("flipped"); // Flip back to login
        }
    });
});
</script>
</body>
</html>
