<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - ABLE'S FARM</title>
  <link rel="icon" type="image/jpeg" href="images/Farm-logo.jpeg" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      margin: 0;
      padding: 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    
    h1 {
      text-align: center;
      color: #ffa726;
    }
    
    .cart-items {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    
    .cart-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 1rem;
    }
    
    .item-details {
      flex-grow: 1;
    }
    
    .item-price {
      font-weight: bold;
      color: #ffa726;
    }
    
    .item-quantity {
      display: flex;
      align-items: center;
      margin: 0 1rem;
    }
    
    .item-quantity button {
      background: #ffa726;
      border: none;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: black;
      cursor: pointer;
    }
    
    .item-quantity span {
      margin: 0 10px;
    }
    
    .remove-item {
      background: transparent;
      border: none;
      color: #ff5252;
      cursor: pointer;
      font-size: 1.2rem;
    }
    
    .cart-summary {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1rem;
      text-align: right;
    }
    
    .cart-summary h2 {
      margin-top: 0;
    }
    
    .checkout-btn {
      background: #ffa726;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      color: black;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s;
      margin-top: 1rem;
    }
    
    .checkout-btn:hover {
      background: #fb8c00;
    }
    
    .empty-cart {
      text-align: center;
      padding: 2rem;
    }
    
    .continue-shopping {
      display: inline-block;
      margin-top: 1rem;
      color: #ffa726;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">ABLE'S FARM</div>
    <a href="birds.html" style="color: white; text-decoration: none;">← Back to Shop</a>
  </header>
  
  <div class="container">
    <h1>Your Shopping Cart</h1>
    
    <div class="cart-items" id="cart-items">
      <!-- Cart items will be inserted here by JavaScript -->
    </div>
    
    <div class="cart-summary" id="cart-summary">
      <!-- Summary will be inserted here by JavaScript -->
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartItemsEl = document.getElementById('cart-items');
      const cartSummaryEl = document.getElementById('cart-summary');
      
      renderCart();
      
      function renderCart() {
        if (cart.length === 0) {
          cartItemsEl.innerHTML = `
            <div class="empty-cart">
              <h2>Your cart is empty</h2>
              <a href="birds.html" class="continue-shopping">Continue Shopping</a>
            </div>
          `;
          cartSummaryEl.style.display = 'none';
          return;
        }
        
        cartItemsEl.innerHTML = '';
        let subtotal = 0;
        
        cart.forEach((item, index) => {
          subtotal += item.price * item.quantity;
          
          const itemEl = document.createElement('div');
          itemEl.className = 'cart-item';
          itemEl.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <div class="item-details">
              <h3>${item.name}</h3>
              <p class="item-price">₦${item.price}</p>
            </div>
            <div class="item-quantity">
              <button onclick="updateQuantity(${index}, -1)">-</button>
              <span>${item.quantity}</span>
              <button onclick="updateQuantity(${index}, 1)">+</button>
            </div>
            <button class="remove-item" onclick="removeItem(${index})">✕</button>
          `;
          
          cartItemsEl.appendChild(itemEl);
        });
        
        cartSummaryEl.innerHTML = `
          <h2>Order Summary</h2>
          <p>Subtotal: ₦${subtotal}</p>
          <p>Delivery: ₦0</p>
          <p><strong>Total: ₦${subtotal}</strong></p>
          <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        `;
      }
      
      window.updateQuantity = function(index, change) {
        const newQuantity = cart[index].quantity + change;
        
        if (newQuantity < 1) {
          removeItem(index);
          return;
        }
        
        cart[index].quantity = newQuantity;
        saveCart();
        renderCart();
      };
      
      window.removeItem = function(index) {
        cart.splice(index, 1);
        saveCart();
        renderCart();
      };
      
      window.checkout = function() {
        alert('Order placed successfully!');
        localStorage.removeItem('cart');
        renderCart();
      };
      
      function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        
        // Also update the cart count on the main page if it's open
        if (window.opener) {
          window.opener.postMessage({
            type: 'cartUpdate',
            count: cart.reduce((total, item) => total + item.quantity, 0)
          }, '*');
        }
      }
    });
    
    // Listen for cart updates from the main page
    window.addEventListener('message', function(event) {
      if (event.data.type === 'cartUpdate') {
        document.dispatchEvent(new Event('DOMContentLoaded'));
      }
    });
  </script>
</body>
</html>
