<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF‑8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Command Center | Able’s Farm + ABFET</title>
  <link rel="stylesheet" href="command.css">
  <script defer src="command.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h2>Command Center</h2>
    <button data-section="chat" class="active">Chat</button>
    <button data-section="memos">Memos</button>
    <button data-section="overview">Overview</button>
    <button id="kill-switch">🛑 Emergency Kill</button>
  </aside>
  <main>
    <section id="chat" class="page active">
      <h2>Live Chat</h2>
      <div class="chat-window" id="chat-window"></div>
      <form id="chat-form">
        <input type="text" placeholder="Message..." required>
        <button>Send</button>
      </form>
    </section>
    <section id="memos" class="page">
      <h2>Send Memo</h2>
      <textarea id="memo-text" placeholder="Your memo here"></textarea>
      <button id="memo-send">Send Memo</button>
      <div id="memo-box"></div>
    </section>
    <section id="overview" class="page">
      <h2>System Overview</h2>
      <p>All personnel: 27</p>
      <p>Active drones: 12</p>
      <p>Open tasks: 8</p>
    </section>
  </main>
</body>
</html>
