<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retailer Dashboard</title>
  <link rel="stylesheet" href="css/Rdash.css">
  <link rel="icon" type="image/jpeg" href="images/Farm-logo.jpeg" />
  <style> 
     .sidebar {
      width: 220px;
      background-color: var(--panel-color);
      padding: 1rem;
      height: 100vh;
      border-right: 1px solid var(--highlight);
    }

    .sidebar h2 {
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li a {
      display: block;
      padding: 0.8rem;
      color: var(--text);
      text-decoration: none;
      border-left: 4px solid transparent;
      transition: 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background-color: var(--highlight);
      color: #000;
      border-left: 4px solid var(--accent);
    }

  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <h2>Retailer</h2>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="R-overview.html">Overview</a></li>
          <li><a href="R-sales.html">Sales</a></li>
          <li><a href="R-inventory.html">Inventory</a></li>
          <li><a href="R-customer.html">Customers</a></li>
          <li><a href="R-settings.html">Settings</a></li>
          
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1>Dashboard</h1>
        <div class="user-profile">
          <span>Welcome, Retailer</span>
        </div>
      </header>

      <!-- Metrics Cards -->
      <section class="cards">
        <div class="card">
          <h3>Total Sales</₦h3>
          <p>₦250,000,000</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p>₦1,200</p>
        </div>
        <div class="card">
          <h3>Customers</h3>
          <p>850</p>
        </div>
        <div class="card">
          <h3>Inventory</h3>
          <p>3,500 items</p>
        </div>
      </section>

      <!-- Sales Chart Placeholder -->
      <section class="charts">
        <div class="chart">
          <h3>Sales Overview</h3>
          <canvas id="salesChart"></canvas>
        </div>
      </section>

      <!-- Product List -->
      <section class="product-list">
        <h3>Top Products</h3>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Units Sold</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Product A</td>
              <td>500</td>
              <td>₦500,000</td>
            </tr>
            <tr>
              <td>Product B</td>
              <td>300</td>
              <td>₦300,000</td>
            </tr>
            <!-- Add more products as needed -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="">// Sample Sales Chart using Chart.js
const ctx = document.getElementById('salesChart').getContext('2d');
const salesChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
    datasets: [{
      label: 'Sales',
      data: [5000, 7000, 8000, 6000, 7500, 9000],
      backgroundColor: 'rgba(0, 255, 247, 0.2)',
      borderColor: '#00fff7',
      borderWidth: 2,
      fill: true,
      tension: 0.4
    }]
  },
  options: {
    responsive: true,
    scales: {
      y: {
        beginAtZero: true
      }
    }
  }
});
</script>
</body>
</html>
