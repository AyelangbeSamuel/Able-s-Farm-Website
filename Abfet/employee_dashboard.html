<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Portal | ABFET</title>
  <link rel="stylesheet" href="Abc/employee_dashboard.css">
  <script defer src="Abj/employee_dashboard.js"></script>
</head>
<body>
  <div class="sidebar">
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
    <nav class="dropdown" id="dropdownMenu">
    <button onclick="showSection('profile')">Profile</button>
    <button onclick="showSection('loans')">Loans</button>
    <button onclick="showSection('memos')">Memos</button>
    <button onclick="showSection('dept')">Department</button>
    </nav>
  </div>

  <main>
  
  </header>
    <section id="profile" class="section active">
      <h2>Welcome, <span id="emp-name">Employee</span></h2>
      <p>ID: <span id="emp-id"></span></p>
    </section>
    <section id="loans" class="section">
      <h2>Loan Application</h2>
      <form id="loan-form">
        <input type="number" id="loan-amount" placeholder="₦ Amount" required>
        <button type="submit">Apply</button>
      </form>
      <div class="loan-status" id="loan-status"></div>
    </section>
    <section id="memos" class="section">
      <h2>Memos</h2>
      <ul id="memo-list"></ul>
    </section>
  </main>
</body>
</html>
